# Publication de l'image sur Docker Hub, déclenchée À LA MAIN uniquement
# (onglet Actions > "Publier sur Docker Hub" > Run workflow).
#
# Prérequis, à configurer une seule fois dans GitHub :
#   Settings > Secrets and variables > Actions > New repository secret
#     DOCKERHUB_USERNAME : votre identifiant Docker Hub
#     DOCKERHUB_TOKEN    : un jeton d'accès Docker Hub (Read & Write), jamais le mot de passe
name: Publier sur Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'image (ex. v1)"
        required: true
        default: v1

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence des secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Ajoutez les secrets DOCKERHUB_USERNAME et DOCKERHUB_TOKEN dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'image est construite pour linux/amd64, l'architecture des instances EC2 t2/t3.
      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ivoiremarket:test

      - name: Tester l'image avant publication
        run: |
          docker run -d --name test -p 8080:3000 ivoiremarket:test
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then echo "Le site répond."; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8080/produits/tecno-spark-30-pro
          test "$(docker exec test id -u)" = "1001"
          docker rm -f test

      - name: Publier sur Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ivoiremarket:${{ inputs.tag }}

      - name: Résumé
        run: |
          echo "Image publiée : ${{ secrets.DOCKERHUB_USERNAME }}/ivoiremarket:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Sur EC2 : docker pull <identifiant>/ivoiremarket:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
